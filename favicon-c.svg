<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Square with heavy rounding — app-icon style -->
  <rect width="64" height="64" rx="16" fill="#1e3357"/>
  <!-- Subtle glow behind wheel -->
  <circle cx="32" cy="30" r="22" fill="rgba(74,158,221,0.12)"/>
  <!-- Outer rim — blue accent -->
  <circle cx="32" cy="30" r="20" fill="none" stroke="#4a9edd" stroke-width="3"/>
  <!-- 4-spoke cross (cleaner at small sizes) -->
  <g stroke="#ede5c8" stroke-width="3" stroke-linecap="round">
    <line x1="32" y1="30" x2="32" y2="11"/>
    <line x1="32" y1="30" x2="32" y2="49"/>
    <line x1="32" y1="30" x2="13" y2="30"/>
    <line x1="32" y1="30" x2="51" y2="30"/>
  </g>
  <!-- Diagonal braces -->
  <g stroke="#ede5c8" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <line x1="32" y1="30" x2="18.5" y2="16.5"/>
    <line x1="32" y1="30" x2="45.5" y2="43.5"/>
    <line x1="32" y1="30" x2="45.5" y2="16.5"/>
    <line x1="32" y1="30" x2="18.5" y2="43.5"/>
  </g>
  <!-- Wide paddles at cardinal points (cream) -->
  <rect x="27" y="7" width="10" height="6" rx="2" fill="#ede5c8"/>
  <rect x="27" y="47" width="10" height="6" rx="2" fill="#ede5c8"/>
  <rect x="9"  y="27" width="6" height="10" rx="2" fill="#ede5c8"/>
  <rect x="49" y="27" width="6" height="10" rx="2" fill="#ede5c8"/>
  <!-- Center hub -->
  <circle cx="32" cy="30" r="5.5" fill="#1e3357" stroke="#4a9edd" stroke-width="2.5"/>
  <!-- Water line at bottom -->
  <path d="M12 52 Q22 49 32 52 Q42 55 52 52 L52 56 Q42 59 32 56 Q22 53 12 56 Z" fill="#4a9edd" opacity="0.6"/>
</svg>
